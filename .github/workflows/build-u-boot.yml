name: Build AX3000T U-Boot

# 原 U-Boot 流程，保留 AX3000T / AX3000T-AN8855 两个板型。
# 相对原文件只改 3 处：
#   1. name 明确机型
#   2. release tag 加 U-Boot_AX3000T_ 前缀（避免与固件 Release 撞 tag）
#   3. 去掉 Delete workflow runs / Remove old Releases（会误删 3 个固件流的记录与 Release）

on:
  # schedule:
  #   - cron: "0 2 15 * *"
  workflow_dispatch:

env:
  REPO_URL: https://github.com/hanwckf/bl-mt798x.git
  REPO_BRANCH: master
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build AX3000T U-Boot
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    strategy:
      matrix:
        board: [ax3000t, ax3000t_an8855]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo -E apt-get -qq install gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /srcdir
          sudo chown $USER:$GROUPS /srcdir

      - name: Clone Source Repository
        working-directory: /srcdir
        run: |
          echo "Free space:"
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH u-boot
          ln -sf /srcdir/u-boot $GITHUB_WORKSPACE/u-boot

      - name: Compile U-Boot
        id: compile
        run: |
          cd u-boot
          SOC=mt7981 BOARD=${{ matrix.board }} MULTI_LAYOUT=1 FIXED_MTDPARTS=1 ./build.sh
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: steps.compile.outputs.status == 'success' && !cancelled()
        with:
          name: u-boot_bin_${{ matrix.board }}${{ env.FILE_DATE }}
          path: u-boot/output

      - name: Generate release tag
        id: tag
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=U-Boot_AX3000T_${{ matrix.board }}_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "U-Boot 🌝 xiaomi ax3000t (${{ matrix.board }})" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: u-boot/output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 以下两步已移除：它们作用于整个仓库，会误删 3 个固件流的运行记录与 Release。
